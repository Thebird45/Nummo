version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: nummo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nummo
    ports:
      - "5432:5432"
    volumes:
      - nummo_pgdata:/var/lib/postgresql/data

volumes:
  nummo_pgdata:
